<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEDOCOM — Suivi d'activité</title>
<meta name="description" content="Dashboard de suivi d'activité et de charge de l'équipe WEDOCOM, connecté en direct au CRA Google Sheets.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   WEDOCOM — Suivi d'activité
   Design tokens
   ------------------------------------------------------------
   Concept : le sujet est un outil de suivi du temps (CRA).
   La signature visuelle s'appuie sur des cadrans type
   chronomètre pour la charge de chaque collaborateur, et sur
   une colonne de chiffres en police mono (lecture "compteur
   digital") pour tous les nombres — heures, %, montants.
   ============================================================ */

:root {
  /* Couleurs */
  --ink: #101820;
  --ink-soft: #182531;
  --paper: #EDF2EF;
  --surface: #FFFFFF;
  --surface-sunken: #F5F8F6;
  --border: #D9E1DD;
  --border-strong: #C3CDC8;

  --text: #14211C;
  --text-muted: #5B6D66;
  --text-faint: #8B9A94;
  --text-on-ink: #EAF1EE;
  --text-on-ink-muted: #9BB0A8;

  --teal: #2C7A73;
  --teal-deep: #1C5450;
  --teal-tint: #DCEAE7;

  --amber: #C77F2E;
  --amber-tint: #F5E4CC;

  --coral: #B14B3F;
  --coral-tint: #F3DAD5;

  --sage: #5B8A5A;
  --sage-tint: #DEEBDC;

  /* Typographie */
  --font-display: "Fraunces", "Iowan Old Style", serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;

  /* Échelle */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 2px rgba(16, 24, 32, 0.04), 0 6px 20px -8px rgba(16, 24, 32, 0.10);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  html { scroll-behavior: auto; }
}

/* ---------------- Top bar ---------------- */

.topbar {
  background: var(--ink);
  color: var(--text-on-ink);
  padding: 22px clamp(16px, 4vw, 40px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  border-bottom: 1px solid #0A1116;
}

.topbar__brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.topbar__mark {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--teal);
  position: relative;
  flex-shrink: 0;
}
.topbar__mark::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 2px;
  height: 11px;
  background: var(--teal);
  transform-origin: bottom center;
  transform: translate(-50%, -100%) rotate(35deg);
}
.topbar__mark::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--teal);
  transform: translate(-50%, -50%);
}

.topbar__title {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0;
}
.topbar__title span { color: var(--text-on-ink-muted); font-weight: 400; }

.topbar__meta {
  display: flex;
  align-items: center;
  gap: 18px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-on-ink-muted);
}

.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--sage);
  display: inline-block;
  margin-right: 6px;
  box-shadow: 0 0 0 3px rgba(91,138,90,0.25);
}
.sync-dot.is-loading { background: var(--amber); box-shadow: 0 0 0 3px rgba(199,127,46,0.25); animation: pulse 1.1s ease-in-out infinite; }
.sync-dot.is-error { background: var(--coral); box-shadow: 0 0 0 3px rgba(177,75,63,0.25); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

.btn-refresh {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-on-ink);
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.btn-refresh:hover { background: rgba(255,255,255,0.12); }
.btn-refresh:focus-visible, a:focus-visible, button:focus-visible, select:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

/* ---------------- Layout ---------------- */

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(16px, 3vw, 32px) clamp(16px, 4vw, 40px) 80px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin: 28px 0 20px;
}

.section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}

.range-select {
  display: flex;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 4px;
}
.range-select button {
  font-family: var(--font-body);
  font-size: 13px;
  padding: 7px 13px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.range-select button:hover { color: var(--text); }
.range-select button.is-active {
  background: var(--ink);
  color: var(--text-on-ink);
}

/* ---------------- KPI row ---------------- */

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-card);
}

.kpi__label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.kpi__value {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.kpi__unit { font-size: 14px; color: var(--text-faint); font-weight: 400; }

.kpi__trend {
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.kpi__trend.up { color: var(--sage); }
.kpi__trend.down { color: var(--coral); }
.kpi__trend.flat { color: var(--text-faint); }

/* ---------------- Cards / sections ---------------- */

.grid-2 {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 22px 20px;
  box-shadow: var(--shadow-card);
  margin-bottom: 16px;
}

.card__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.card__title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  margin: 0;
}
.card__subtitle {
  font-family: var(--font-body);
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 2px;
}

.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 320px; }

/* ---------------- Gauges (signature element) ---------------- */

.gauge-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
}

.gauge {
  text-align: center;
  padding: 14px 8px 4px;
}

.gauge__name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-top: 6px;
}
.gauge__sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 1px;
}

.gauge__value {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
}

/* ---------------- Tables ---------------- */

.table-scroll { overflow-x: auto; }

table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.data th, table.data td {
  padding: 9px 10px;
  text-align: right;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
table.data th:first-child, table.data td:first-child {
  text-align: left;
  position: sticky;
  left: 0;
  background: var(--surface);
}
table.data thead th {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  font-weight: 500;
  border-bottom: 1px solid var(--border-strong);
}
table.data tbody tr:hover td { background: var(--surface-sunken); }
table.data td { font-family: var(--font-mono); }
table.data td.label-cell, table.data th.label-cell { font-family: var(--font-body); text-align: left; }

.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
}
.pill--ok { background: var(--sage-tint); color: #2E4A2E; }
.pill--warn { background: var(--amber-tint); color: #6E4517; }
.pill--over { background: var(--coral-tint); color: #6B2A21; }
.pill--muted { background: var(--surface-sunken); color: var(--text-faint); }

/* Heatmap occupation cells */
td.heat { text-align: center; font-weight: 600; border-radius: 4px; }

/* ---------------- Prestations status bars ---------------- */

.presta-row { margin-bottom: 14px; }
.presta-row:last-child { margin-bottom: 0; }
.presta-row__top {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  margin-bottom: 6px;
}
.presta-row__name { font-weight: 600; color: var(--text); }
.presta-row__count { font-family: var(--font-mono); color: var(--text-muted); }
.presta-bar {
  height: 8px;
  border-radius: 4px;
  background: var(--surface-sunken);
  overflow: hidden;
  display: flex;
}
.presta-bar__seg--cours { background: var(--teal); }
.presta-bar__seg--suspens { background: var(--amber); }
.presta-bar__seg--termine { background: var(--border-strong); }

.legend {
  display: flex;
  gap: 16px;
  margin-top: 14px;
  font-size: 11.5px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.legend__dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

/* ---------------- Data quality banner ---------------- */

.dq-banner {
  border: 1px solid #E3C79A;
  background: var(--amber-tint);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  margin-bottom: 20px;
  font-size: 13px;
  color: #6E4517;
  display: none;
}
.dq-banner.is-visible { display: block; }
.dq-banner__title { font-weight: 700; margin-bottom: 6px; font-family: var(--font-body); }
.dq-banner ul { margin: 6px 0 0; padding-left: 18px; }
.dq-banner code { font-family: var(--font-mono); font-size: 12px; }

/* ---------------- States ---------------- */

.state-panel {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}
.state-panel__title { font-family: var(--font-display); font-size: 20px; color: var(--text); margin-bottom: 8px; }
.state-panel code {
  display: inline-block;
  margin-top: 10px;
  background: var(--surface-sunken);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 12px;
  max-width: 640px;
}

footer.foot {
  text-align: center;
  padding: 30px 20px 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
}
footer.foot a { color: var(--text-muted); }

.fade-in { animation: fadeIn 0.5s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__mark" aria-hidden="true"></span>
    <h1 class="topbar__title">WEDOCOM <span>· Suivi d'activité</span></h1>
  </div>
  <div class="topbar__meta">
    <span><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Connexion…</span></span>
    <button class="btn-refresh" id="refreshBtn">Rafraîchir</button>
  </div>
</header>

<main class="wrap">
  <div id="app">
    <div class="state-panel"><div class="state-panel__title">Chargement du CRA…</div></div>
  </div>
</main>

<footer class="foot">
  Données lues en direct depuis le Google Sheet « CRA-WEDOCOM », onglet Dashboard.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
/* ============================================================
   CONFIGURATION — à adapter si besoin
   ------------------------------------------------------------
   PUBLISHED_CSV_URL : l'URL générée par
   Fichier > Partager > Publier sur le web > format CSV,
   pour l'onglet "Dashboard" précisément.
   C'est cette étape (différente du partage classique) qui
   active un accès public compatible avec la lecture depuis
   un site externe (CORS).

   Le classeur doit rester "Publié sur le web" pour cet onglet.
   ============================================================ */

window.DASHBOARD_CONFIG = {
  PUBLISHED_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJHWIH8n1BvTnGkYNfVN55C5xEDDCQNS0MvQ_pHU1qpmsbNr-CuU20eWKgBz_A5huSNlrLhlJdGvRp/pub?gid=421722796&single=true&output=csv",

  // Repli utilisés uniquement si l'URL ci-dessus est indisponible.
  SHEET_ID: "1P31O3qN6V1PC-i_CkpRuYupaUBOxbfB9_SELgE805aQ",
  GID: "421722796",

  // Seuil (en heures) au-delà duquel une cellule mensuelle est
  // considérée comme une anomalie de données (bug de formule,
  // fusion de cellule, etc.) et exclue des graphiques/totaux.
  ANOMALY_THRESHOLD_HOURS: 300,

  // Jours ouvrés standard utilisés pour convertir un objectif
  // "jours/mois" en heures si besoin (7h/jour).
  HOURS_PER_DAY: 7,

  // Rafraîchissement automatique (ms). 0 = désactivé.
  AUTO_REFRESH_MS: 5 * 60 * 1000,
};

</script>
<script>
/* ============================================================
   PARSER — transforme le CSV brut de l'onglet Dashboard
   en un objet de données structuré et propre.
   ============================================================ */

const Parser = (() => {
  const cfg = window.DASHBOARD_CONFIG;

  function buildCsvUrl() {
    // URL "Publier sur le web" : la plus fiable pour un accès
    // cross-origin depuis un site statique (CORS activé).
    const sep = cfg.PUBLISHED_CSV_URL.includes("?") ? "&" : "?";
    return `${cfg.PUBLISHED_CSV_URL}${sep}cachebust=${Date.now()}`;
  }

  function buildFallbackUrl() {
    // Repli (fonctionne si le partage évolue vers un mode
    // compatible CORS sans passer par "Publier sur le web").
    return `https://docs.google.com/spreadsheets/d/${cfg.SHEET_ID}/gviz/tq?tqx=out:csv&gid=${cfg.GID}&cachebust=${Date.now()}`;
  }

  async function fetchCsvText() {
    const tryUrls = [buildCsvUrl(), buildFallbackUrl()];
    let lastError;
    for (const url of tryUrls) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (!text || text.trim().length === 0) throw new Error("Réponse vide");
        return text;
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError || new Error("Impossible de contacter Google Sheets");
  }

  function parseNumber(raw) {
    if (raw === undefined || raw === null) return 0;
    let s = String(raw).trim();
    if (s === "" || s === "​") return 0;
    s = s.replace(/\s|\u00A0|\u200B/g, ""); // espaces normaux, insécables, zero-width
    s = s.replace(",", ".");
    const n = parseFloat(s);
    return Number.isFinite(n) ? n : 0;
  }

  function parsePercent(raw) {
    if (raw === undefined || raw === null) return null;
    const s = String(raw).trim();
    if (s === "") return null;
    const n = parseFloat(s.replace("%", "").replace(",", "."));
    return Number.isFinite(n) ? n : null;
  }

  function cell(rows, r, c) {
    if (!rows[r]) return "";
    return (rows[r][c] ?? "").toString().trim();
  }

  function findRowIndex(rows, colIndex, matcher, fromIndex = 0) {
    for (let i = fromIndex; i < rows.length; i++) {
      const v = cell(rows, i, colIndex);
      if (typeof matcher === "string" ? v === matcher : matcher(v)) return i;
    }
    return -1;
  }

  function readMonthsHeader(rows, headerRowIdx, startCol) {
    const months = [];
    let c = startCol;
    while (true) {
      const v = cell(rows, headerRowIdx, c);
      if (!v) break;
      months.push(v);
      c++;
      if (months.length > 36) break; // garde-fou
    }
    return { months, endCol: c };
  }

  // Lit un bloc "Nom | mois... " de 6 lignes de personnes + 1 ligne Total
  function readPersonBlock(rows, headerRowIdx, startCol, monthCount, anomalies, blockLabel) {
    const people = [];
    let r = headerRowIdx + 1;
    while (true) {
      const name = cell(rows, r, 0);
      if (!name || name === "Total") break;
      const values = [];
      for (let m = 0; m < monthCount; m++) {
        const raw = cell(rows, r, startCol + m);
        let v = parseNumber(raw);
        if (v > cfg.ANOMALY_THRESHOLD_HOURS) {
          anomalies.push({
            location: `${blockLabel} · ${name} · ${cell(rows, headerRowIdx, startCol + m)}`,
            rawValue: raw,
          });
          v = null; // exclu des calculs/graphiques
        }
        values.push(v);
      }
      people.push({ name, values });
      r++;
      if (r - headerRowIdx > 20) break; // garde-fou
    }
    const totalRowIdx = r; // ligne "Total"
    const totalValues = [];
    for (let m = 0; m < monthCount; m++) {
      const raw = cell(rows, totalRowIdx, startCol + m);
      let v = parseNumber(raw);
      if (v > cfg.ANOMALY_THRESHOLD_HOURS * 6) {
        anomalies.push({
          location: `${blockLabel} · Total · ${cell(rows, headerRowIdx, startCol + m)}`,
          rawValue: raw,
        });
        v = null;
      }
      totalValues.push(v);
    }
    return { people, total: totalValues, nextRowIdx: totalRowIdx + 1 };
  }

  function parse(csvText) {
    const rows = Papa.parse(csvText, { skipEmptyLines: false }).data;
    const anomalies = [];

    // --- Bloc Facturé ---
    const idxFacture = findRowIndex(rows, 0, "Facturé");
    if (idxFacture === -1) throw new Error("Section 'Facturé' introuvable — la mise en page de l'onglet a peut-être changé.");
    const headFacture = idxFacture + 1;
    const { months, endCol } = readMonthsHeader(rows, headFacture, 1);
    const blocFacture = readPersonBlock(rows, headFacture, 1, months.length, anomalies, "Facturé");

    // --- Bloc Non facturé ---
    const idxNonFacture = findRowIndex(rows, 0, "Non facturé", blocFacture.nextRowIdx);
    const blocNonFacture = readPersonBlock(rows, idxNonFacture + 1, 1, months.length, anomalies, "Non facturé");

    // --- Bloc Total (section) ---
    const idxTotalSection = findRowIndex(rows, 0, "Total", blocNonFacture.nextRowIdx + 1);
    const blocTotal = readPersonBlock(rows, idxTotalSection + 1, 1, months.length, anomalies, "Total");

    // --- Table occupation % (4e occurrence de "Nom" en colonne A) ---
    let nomOccurrences = 0, idxOccupHeader = -1;
    for (let i = 0; i < rows.length; i++) {
      if (cell(rows, i, 0) === "Nom") {
        nomOccurrences++;
        if (nomOccurrences === 4) { idxOccupHeader = i; break; }
      }
    }
    const occupation = { months: [], people: [] };
    if (idxOccupHeader !== -1) {
      const occMonths = readMonthsHeader(rows, idxOccupHeader, 1).months;
      occupation.months = occMonths;
      let r = idxOccupHeader + 1;
      while (true) {
        const label = cell(rows, r, 0);
        if (!label || label === "Total") break;
        const match = label.match(/^(.*?)\s*\((\d+)\s*jours?\)/);
        const name = match ? match[1].trim() : label;
        const capacityDays = match ? parseInt(match[2], 10) : null;
        const values = [];
        for (let m = 0; m < occMonths.length; m++) {
          values.push(parsePercent(cell(rows, r, 1 + m)));
        }
        occupation.people.push({ name, capacityDays, values });
        r++;
        if (r - idxOccupHeader > 20) break;
      }
    }

    // --- Prestations (Nbre de prestations) : colonne P (15) ---
    const idxPresta = findRowIndex(rows, 15, "Prestation");
    const prestations = [];
    if (idxPresta !== -1) {
      let r = idxPresta + 1;
      while (true) {
        const name = cell(rows, r, 15);
        if (!name || name === "Total") break;
        prestations.push({
          name,
          enCours: parseNumber(cell(rows, r, 16)),
          enSuspens: parseNumber(cell(rows, r, 17)),
          termine: parseNumber(cell(rows, r, 18)),
        });
        r++;
        if (r - idxPresta > 20) break;
      }
    }

    // --- Heures par prestation (Total / travaillées / reste) ---
    const idxHeures = findRowIndex(rows, 16, "Total nbre d'heure");
    const prestaHeures = [];
    if (idxHeures !== -1) {
      let r = idxHeures + 1;
      while (true) {
        const name = cell(rows, r, 15);
        if (!name || name === "Total") break;
        prestaHeures.push({
          name,
          totalHeures: parseNumber(cell(rows, r, 16)),
          travaillees: parseNumber(cell(rows, r, 17)),
          reste: parseNumber(cell(rows, r, 18)),
        });
        r++;
        if (r - idxHeures > 20) break;
      }
    }

    // --- Non facturé par catégorie ---
    const idxCat = findRowIndex(rows, 0, (v) => v.toLowerCase() === "non facturé", idxTotalSection + 15);
    const nonFactureCategories = { months: [], categories: [] };
    if (idxCat !== -1) {
      const catMonths = readMonthsHeader(rows, idxCat, 1).months;
      nonFactureCategories.months = catMonths;
      let r = idxCat + 1;
      while (true) {
        const name = cell(rows, r, 0);
        if (!name || name === "Total") break;
        const values = [];
        for (let m = 0; m < catMonths.length; m++) {
          const raw = cell(rows, r, 1 + m);
          let v = parseNumber(raw);
          if (v > cfg.ANOMALY_THRESHOLD_HOURS) {
            anomalies.push({ location: `Non facturé (catégorie) · ${name} · ${catMonths[m]}`, rawValue: raw });
            v = null;
          }
          values.push(v);
        }
        nonFactureCategories.categories.push({ name, values });
        r++;
        if (r - idxCat > 20) break;
      }
    }

    return {
      months,
      facture: blocFacture,
      nonFacture: blocNonFacture,
      total: blocTotal,
      occupation,
      prestations,
      prestaHeures,
      nonFactureCategories,
      anomalies,
      fetchedAt: new Date(),
    };
  }

  return { fetchCsvText, parse };
})();

</script>
<script>
/* ============================================================
   APP — orchestration : récupération des données, état,
   et rendu de tous les blocs du dashboard.
   ============================================================ */

const PERSON_COLORS = {
  "Benjamin": "#2C7A73",
  "Florence": "#C77F2E",
  "Mélanie": "#B14B3F",
  "Randy": "#5B8A5A",
  "Simon": "#6E6AA8",
  "Equipe Dév": "#8B9A94",
};
const FALLBACK_COLORS = ["#2C7A73", "#C77F2E", "#B14B3F", "#5B8A5A", "#6E6AA8", "#8B9A94"];

function colorFor(name, idx) {
  return PERSON_COLORS[name] || FALLBACK_COLORS[idx % FALLBACK_COLORS.length];
}

const state = {
  data: null,
  monthRange: 6, // nombre de mois affichés, ou "all"
  charts: {},
};

const els = {
  app: document.getElementById("app"),
  syncDot: document.getElementById("syncDot"),
  syncLabel: document.getElementById("syncLabel"),
  refreshBtn: document.getElementById("refreshBtn"),
};

function fmtHours(n) {
  if (n === null || n === undefined) return "—";
  return n.toLocaleString("fr-FR", { maximumFractionDigits: 0 });
}
function fmtPercent(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return `${Math.round(n)}%`;
}
function sumSkipNull(arr) {
  return arr.reduce((acc, v) => acc + (v ?? 0), 0);
}
function lastValid(arr) {
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i] !== null && arr[i] !== undefined) return { value: arr[i], index: i };
  }
  return { value: null, index: -1 };
}

function visibleRange(monthsLength) {
  if (state.monthRange === "all") return { start: 0, end: monthsLength };
  const start = Math.max(0, monthsLength - state.monthRange);
  return { start, end: monthsLength };
}

/* ---------------- Boot ---------------- */

async function boot() {
  setSyncState("loading", "Synchronisation…");
  try {
    const csv = await Parser.fetchCsvText();
    const data = Parser.parse(csv);
    state.data = data;
    setSyncState("ok", `Synchronisé à ${data.fetchedAt.toLocaleTimeString("fr-FR")}`);
    renderAll();
  } catch (err) {
    console.error(err);
    setSyncState("error", "Échec de synchronisation");
    renderError(err);
  }
}

function setSyncState(kind, label) {
  els.syncDot.className = "sync-dot" + (kind === "loading" ? " is-loading" : kind === "error" ? " is-error" : "");
  els.syncLabel.textContent = label;
}

els.refreshBtn.addEventListener("click", boot);

if (window.DASHBOARD_CONFIG.AUTO_REFRESH_MS > 0) {
  setInterval(boot, window.DASHBOARD_CONFIG.AUTO_REFRESH_MS);
}

/* ---------------- Error state ---------------- */

function renderError(err) {
  els.app.innerHTML = `
    <div class="state-panel fade-in">
      <div class="state-panel__title">Impossible de lire la feuille Google Sheets</div>
      <p>Vérifie que le classeur est bien partagé en <strong>« Tous les utilisateurs qui ont le lien — Lecteur »</strong>,
      et que l'onglet « Dashboard » n'a pas changé de structure.</p>
      <code>${(err && err.message) || err}</code>
    </div>`;
}

/* ---------------- Main render ---------------- */

function renderAll() {
  const d = state.data;
  els.app.innerHTML = baseLayout();
  renderRangeButtons();
  renderDataQuality(d);
  renderKpis(d);
  renderMonthlyChart(d);
  renderPersonChart(d);
  renderGauges(d);
  renderPrestationStatus(d);
  renderServiceHours(d);
  renderOccupationTable(d);
  renderNonFactureCategories(d);
}

function baseLayout() {
  return `
    <div class="dq-banner" id="dqBanner"></div>

    <div class="controls">
      <span class="section-label">Vue d'ensemble</span>
      <div class="range-select" id="rangeSelect">
        <button data-range="3">3 mois</button>
        <button data-range="6">6 mois</button>
        <button data-range="12">12 mois</button>
        <button data-range="all">Tout</button>
      </div>
    </div>

    <div class="kpi-grid fade-in" id="kpiGrid"></div>

    <div class="grid-2">
      <div>
        <div class="card fade-in">
          <div class="card__head">
            <div>
              <h2 class="card__title">Facturé vs Non facturé</h2>
              <div class="card__subtitle">Heures par mois</div>
            </div>
          </div>
          <div class="chart-box"><canvas id="chartMonthly"></canvas></div>
        </div>

        <div class="card fade-in">
          <div class="card__head">
            <div>
              <h2 class="card__title">Charge par collaborateur</h2>
              <div class="card__subtitle">Total d'heures (facturé + non facturé) par mois</div>
            </div>
          </div>
          <div class="chart-box tall"><canvas id="chartPerson"></canvas></div>
        </div>

        <div class="card fade-in">
          <div class="card__head">
            <div>
              <h2 class="card__title">Taux d'occupation</h2>
              <div class="card__subtitle">% du temps contractuel utilisé, par collaborateur et par mois</div>
            </div>
          </div>
          <div class="table-scroll"><table class="data" id="occupationTable"></table></div>
        </div>
      </div>

      <div>
        <div class="card fade-in">
          <div class="card__head">
            <div>
              <h2 class="card__title">Charge actuelle</h2>
              <div class="card__subtitle">Dernier mois renseigné, par collaborateur</div>
            </div>
          </div>
          <div class="gauge-row" id="gaugeRow"></div>
        </div>

        <div class="card fade-in">
          <div class="card__head">
            <div>
              <h2 class="card__title">Statut des prestations</h2>
              <div class="card__subtitle">Répartition par type</div>
            </div>
          </div>
          <div id="prestaStatus"></div>
          <div class="legend">
            <span><span class="legend__dot" style="background:var(--teal)"></span>En cours</span>
            <span><span class="legend__dot" style="background:var(--amber)"></span>En suspens</span>
            <span><span class="legend__dot" style="background:var(--border-strong)"></span>Terminé</span>
          </div>
        </div>

        <div class="card fade-in">
          <div class="card__head">
            <div>
              <h2 class="card__title">Heures par prestation</h2>
              <div class="card__subtitle">Travaillées vs allouées</div>
            </div>
          </div>
          <div class="table-scroll"><table class="data" id="serviceHoursTable"></table></div>
        </div>

        <div class="card fade-in">
          <div class="card__head">
            <div>
              <h2 class="card__title">Non facturé — par catégorie</h2>
              <div class="card__subtitle">Total sur la période sélectionnée</div>
            </div>
          </div>
          <div class="table-scroll"><table class="data" id="categoryTable"></table></div>
        </div>
      </div>
    </div>
  `;
}

function renderRangeButtons() {
  const container = document.getElementById("rangeSelect");
  const buttons = [...container.querySelectorAll("button")];
  function sync() {
    buttons.forEach((b) => {
      const r = b.dataset.range === "all" ? "all" : parseInt(b.dataset.range, 10);
      b.classList.toggle("is-active", r === state.monthRange);
    });
  }
  buttons.forEach((b) => {
    b.addEventListener("click", () => {
      state.monthRange = b.dataset.range === "all" ? "all" : parseInt(b.dataset.range, 10);
      sync();
      renderKpis(state.data);
      renderMonthlyChart(state.data);
      renderPersonChart(state.data);
      renderOccupationTable(state.data);
      renderNonFactureCategories(state.data);
    });
  });
  sync();
}

/* ---------------- Data quality banner ---------------- */

function renderDataQuality(d) {
  const banner = document.getElementById("dqBanner");
  if (!d.anomalies.length) { banner.classList.remove("is-visible"); return; }
  banner.classList.add("is-visible");
  const items = d.anomalies.slice(0, 8).map(
    (a) => `<li><code>${a.location}</code> — valeur brute lue : <code>${a.rawValue}</code></li>`
  ).join("");
  const more = d.anomalies.length > 8 ? `<div style="margin-top:6px">+ ${d.anomalies.length - 8} autre(s) valeur(s) suspecte(s).</div>` : "";
  banner.innerHTML = `
    <div class="dq-banner__title">⚠ ${d.anomalies.length} valeur(s) incohérente(s) détectée(s) et exclue(s) des calculs</div>
    <div>Ces cellules dépassent ${window.DASHBOARD_CONFIG.ANOMALY_THRESHOLD_HOURS}h sur un mois pour une personne — probablement une erreur de formule dans la feuille source (ex. date au lieu d'un nombre d'heures). Elles sont ignorées ici pour ne pas fausser les graphiques :</div>
    <ul>${items}</ul>${more}`;
}

/* ---------------- KPIs ---------------- */

function renderKpis(d) {
  const { start, end } = visibleRange(d.months.length);
  const facTotal = sumSkipNull(d.facture.total.slice(start, end));
  const nonFacTotal = sumSkipNull(d.nonFacture.total.slice(start, end));
  const grandTotal = facTotal + nonFacTotal;
  const tauxFacturation = grandTotal > 0 ? (facTotal / grandTotal) * 100 : null;

  // tendance : dernier mois visible vs précédent, sur le total facturé
  const facSlice = d.facture.total.slice(start, end);
  const lastIdx = facSlice.map((v, i) => (v !== null ? i : -1)).filter((i) => i >= 0).pop();
  let trendHtml = "";
  if (lastIdx !== undefined && lastIdx > 0 && facSlice[lastIdx - 1] !== null) {
    const diff = facSlice[lastIdx] - facSlice[lastIdx - 1];
    const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
    const arrow = diff > 0 ? "↑" : diff < 0 ? "↓" : "→";
    trendHtml = `<div class="kpi__trend ${cls}">${arrow} ${Math.abs(Math.round(diff))}h vs mois précédent</div>`;
  }

  // occupation moyenne (dernier mois valide, tous collaborateurs confondus, hors Equipe Dév si pas de jours définis)
  let occAvg = null;
  if (d.occupation.people.length) {
    const perPersonLast = d.occupation.people
      .filter((p) => p.capacityDays)
      .map((p) => lastValid(p.values).value)
      .filter((v) => v !== null);
    if (perPersonLast.length) occAvg = perPersonLast.reduce((a, b) => a + b, 0) / perPersonLast.length;
  }

  const enCours = sumSkipNull(d.prestations.map((p) => p.enCours));

  const cards = [
    { label: "Heures facturées", value: fmtHours(facTotal), unit: "h", trend: trendHtml },
    { label: "Heures non facturées", value: fmtHours(nonFacTotal), unit: "h" },
    { label: "Taux de facturation", value: fmtPercent(tauxFacturation), unit: "" },
    { label: "Occupation moyenne", value: fmtPercent(occAvg), unit: "" },
    { label: "Prestations en cours", value: fmtHours(enCours), unit: "" },
  ];

  document.getElementById("kpiGrid").innerHTML = cards.map((c) => `
    <div class="kpi">
      <div class="kpi__label">${c.label}</div>
      <div class="kpi__value">${c.value}<span class="kpi__unit">${c.unit}</span></div>
      ${c.trend || ""}
    </div>`).join("");
}

/* ---------------- Chart: Facturé vs Non facturé ---------------- */

function renderMonthlyChart(d) {
  const { start, end } = visibleRange(d.months.length);
  const labels = d.months.slice(start, end);
  const facture = d.facture.total.slice(start, end);
  const nonFacture = d.nonFacture.total.slice(start, end);

  if (state.charts.monthly) state.charts.monthly.destroy();
  const ctx = document.getElementById("chartMonthly");
  state.charts.monthly = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: "Facturé", data: facture, backgroundColor: "#2C7A73", borderRadius: 4, maxBarThickness: 34 },
        { label: "Non facturé", data: nonFacture, backgroundColor: "#C77F2E", borderRadius: 4, maxBarThickness: 34 },
      ],
    },
    options: baseChartOptions({ stacked: true }),
  });
}

/* ---------------- Chart: charge par personne ---------------- */

function renderPersonChart(d) {
  const { start, end } = visibleRange(d.months.length);
  const labels = d.months.slice(start, end);

  if (state.charts.person) state.charts.person.destroy();
  const ctx = document.getElementById("chartPerson");
  state.charts.person = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: d.total.people.map((p, idx) => ({
        label: p.name,
        data: p.values.slice(start, end),
        backgroundColor: colorFor(p.name, idx),
        borderRadius: 4,
        maxBarThickness: 30,
      })),
    },
    options: baseChartOptions({ stacked: true }),
  });
}

function baseChartOptions({ stacked }) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: {
        position: "bottom",
        labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: "circle", font: { family: "Inter", size: 11.5 }, color: "#5B6D66" },
      },
      tooltip: {
        backgroundColor: "#101820",
        titleFont: { family: "IBM Plex Mono", size: 11 },
        bodyFont: { family: "IBM Plex Mono", size: 11 },
        padding: 10,
        cornerRadius: 6,
        callbacks: { label: (c) => `${c.dataset.label} : ${c.formattedValue} h` },
      },
    },
    scales: {
      x: { stacked, grid: { display: false }, ticks: { font: { family: "Inter", size: 11 }, color: "#8B9A94" } },
      y: { stacked, grid: { color: "#D9E1DD" }, ticks: { font: { family: "IBM Plex Mono", size: 10.5 }, color: "#8B9A94" } },
    },
  };
}

/* ---------------- Gauges ---------------- */

function renderGauges(d) {
  const container = document.getElementById("gaugeRow");
  container.innerHTML = d.occupation.people.map((p, idx) => {
    const { value, index } = lastValid(p.values);
    const monthLabel = index >= 0 ? d.occupation.months[index] : "—";
    return gaugeSvg(p.name, value, monthLabel, colorFor(p.name, idx));
  }).join("");
}

function gaugeSvg(name, value, monthLabel, color) {
  const r = 38, cx = 50, cy = 50, circumference = 2 * Math.PI * r;
  const capped = value === null ? 0 : Math.min(value, 150);
  const fraction = capped / 150;
  const offset = circumference * (1 - fraction);
  const track = "#E7ECE9";
  const ringColor = value === null ? "#C3CDC8" : value > 115 ? "#B14B3F" : value < 65 ? "#C77F2E" : "#5B8A5A";
  return `
    <div class="gauge">
      <svg width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Occupation ${name} : ${value === null ? "non renseigné" : Math.round(value) + "%"}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="9"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${ringColor}" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
          transform="rotate(-90 ${cx} ${cy})"/>
        <text x="50" y="46" text-anchor="middle" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#14211C">${value === null ? "—" : Math.round(value) + "%"}</text>
        <text x="50" y="61" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#8B9A94">${monthLabel}</text>
      </svg>
      <div class="gauge__name">${name}</div>
    </div>`;
}

/* ---------------- Prestations : statut ---------------- */

function renderPrestationStatus(d) {
  const container = document.getElementById("prestaStatus");
  container.innerHTML = d.prestations.map((p) => {
    const total = p.enCours + p.enSuspens + p.termine || 1;
    const pct = (v) => (v / total) * 100;
    return `
      <div class="presta-row">
        <div class="presta-row__top">
          <span class="presta-row__name">${p.name}</span>
          <span class="presta-row__count">${p.enCours} en cours · ${p.termine} terminées</span>
        </div>
        <div class="presta-bar">
          <div class="presta-bar__seg presta-bar__seg--cours" style="width:${pct(p.enCours)}%"></div>
          <div class="presta-bar__seg presta-bar__seg--suspens" style="width:${pct(p.enSuspens)}%"></div>
          <div class="presta-bar__seg presta-bar__seg--termine" style="width:${pct(p.termine)}%"></div>
        </div>
      </div>`;
  }).join("");
}

/* ---------------- Heures par prestation ---------------- */

function renderServiceHours(d) {
  const rows = d.prestaHeures.map((p) => {
    const pct = p.totalHeures > 0 ? Math.min(100, (p.travaillees / p.totalHeures) * 100) : 0;
    return `
      <tr>
        <td class="label-cell">${p.name}</td>
        <td>${fmtHours(p.travaillees)}</td>
        <td>${fmtHours(p.totalHeures)}</td>
        <td>${cellHeatPill(pct)}</td>
      </tr>`;
  }).join("");
  document.getElementById("serviceHoursTable").innerHTML = `
    <thead><tr><th class="label-cell">Prestation</th><th>Travaillées</th><th>Allouées</th><th>Avancement</th></tr></thead>
    <tbody>${rows}</tbody>`;
}

function cellHeatPill(pct) {
  const kind = pct >= 90 ? "over" : pct >= 60 ? "warn" : "ok";
  return `<span class="pill pill--${kind}">${Math.round(pct)}%</span>`;
}

/* ---------------- Table occupation (heatmap) ---------------- */

function renderOccupationTable(d) {
  const { start, end } = visibleRange(d.occupation.months.length);
  const months = d.occupation.months.slice(start, end);
  const head = `<thead><tr><th class="label-cell">Collaborateur</th>${months.map((m) => `<th>${m.replace(" 20", " '")}</th>`).join("")}</tr></thead>`;
  const body = d.occupation.people.map((p) => {
    const cells = p.values.slice(start, end).map((v) => {
      if (v === null) return `<td class="heat">—</td>`;
      const bg = heatColor(v);
      return `<td class="heat" style="background:${bg.bg};color:${bg.fg}">${Math.round(v)}%</td>`;
    }).join("");
    return `<tr><td class="label-cell">${p.name}${p.capacityDays ? ` <span style="color:var(--text-faint)">(${p.capacityDays}j)</span>` : ""}</td>${cells}</tr>`;
  }).join("");
  document.getElementById("occupationTable").innerHTML = head + `<tbody>${body}</tbody>`;
}

function heatColor(v) {
  if (v > 115) return { bg: "#F3DAD5", fg: "#6B2A21" };
  if (v < 65) return { bg: "#F5E4CC", fg: "#6E4517" };
  return { bg: "#DEEBDC", fg: "#2E4A2E" };
}

/* ---------------- Non facturé par catégorie ---------------- */

function renderNonFactureCategories(d) {
  const { start, end } = visibleRange(d.nonFactureCategories.months.length);
  const rows = d.nonFactureCategories.categories
    .map((c) => ({ name: c.name, total: sumSkipNull(c.values.slice(start, end)) }))
    .sort((a, b) => b.total - a.total);
  const grand = sumSkipNull(rows.map((r) => r.total)) || 1;
  const body = rows.map((r) => `
    <tr>
      <td class="label-cell">${r.name}</td>
      <td>${fmtHours(r.total)}</td>
      <td>${fmtPercent((r.total / grand) * 100)}</td>
    </tr>`).join("");
  document.getElementById("categoryTable").innerHTML = `
    <thead><tr><th class="label-cell">Catégorie</th><th>Heures</th><th>Part</th></tr></thead>
    <tbody>${body}</tbody>`;
}

boot();

</script>
</body>
